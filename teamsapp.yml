# yaml-language-server: $schema=https://aka.ms/teams-toolkit/v1.7/yaml.schema.json
#
# Microsoft 365 Agents Toolkit lifecycle for gpt-rag-teams.
#
# Scope: this file owns ONLY the Teams-app-package + Bot Service registration
# steps (which are not covered by the parent GPT-RAG accelerator's `azd up`).
# The actual Azure App Service / Container compute that hosts this bot is
# expected to be provisioned by the GPT-RAG accelerator (see ../GPT-RAG/azure.yaml
# `teamsBot` service entry) and the code deployed via `azd deploy teamsBot`.

version: v1.7

environmentFolderPath: ./env

provision:
  # Create or update the Teams app entry in Developer Portal.
  - uses: teamsApp/create
    with:
      name: gpt-rag-teams-${{APP_NAME_SUFFIX}}
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  - uses: teamsApp/validateManifest
    with:
      manifestPath: ./appPackage/manifest.json

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

publish:
  - uses: teamsApp/publishAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
